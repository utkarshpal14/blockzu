<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#070A14"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20.48" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="1024" height="1024" rx="225.28" fill="url(#bgGrad)"/>
  <!-- Border outline -->
  <rect x="20.48" y="20.48" width="983.04" height="983.04" rx="204.8" fill="none" stroke="#38BDF8" stroke-width="15.36" stroke-opacity="0.4"/>
  
  <!-- 2x2 Glowing Polyomino Block Pattern -->
  <!-- Block 1: Cyan Top Left -->
  <rect x="225.28" y="225.28" width="256" height="256" rx="40.96" fill="url(#cyanGrad)" filter="url(#glow)"/>
  <!-- Block 2: Gold Top Right -->
  <rect x="542.72" y="225.28" width="256" height="256" rx="40.96" fill="url(#goldGrad)" filter="url(#glow)"/>
  <!-- Block 3: Violet Bottom Left -->
  <rect x="225.28" y="542.72" width="256" height="256" rx="40.96" fill="url(#violetGrad)" filter="url(#glow)"/>
  <!-- Block 4: Rose Bottom Right -->
  <rect x="542.72" y="542.72" width="256" height="256" rx="40.96" fill="url(#roseGrad)" filter="url(#glow)"/>
  
  <!-- Inner Highlight Gloss -->
  <circle cx="307.2" cy="286.72" r="30.72" fill="#FFFFFF" fill-opacity="0.6"/>
  <circle cx="624.64" cy="286.72" r="30.72" fill="#FFFFFF" fill-opacity="0.6"/>
  <circle cx="307.2" cy="604.16" r="30.72" fill="#FFFFFF" fill-opacity="0.6"/>
  <circle cx="624.64" cy="604.16" r="30.72" fill="#FFFFFF" fill-opacity="0.6"/>

  <!-- Logo Typography -->
  <text x="512" y="921.6" font-family="'Poppins', 'Segoe UI', sans-serif" font-weight="800" font-size="112.64px" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">BLOCKZU</text>
</svg>