<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#070A14"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10.24" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112.64" fill="url(#bgGrad)"/>
  <!-- Border outline -->
  <rect x="10.24" y="10.24" width="491.52" height="491.52" rx="102.4" fill="none" stroke="#38BDF8" stroke-width="7.68" stroke-opacity="0.4"/>
  
  <!-- 2x2 Glowing Polyomino Block Pattern -->
  <!-- Block 1: Cyan Top Left -->
  <rect x="112.64" y="112.64" width="128" height="128" rx="20.48" fill="url(#cyanGrad)" filter="url(#glow)"/>
  <!-- Block 2: Gold Top Right -->
  <rect x="271.36" y="112.64" width="128" height="128" rx="20.48" fill="url(#goldGrad)" filter="url(#glow)"/>
  <!-- Block 3: Violet Bottom Left -->
  <rect x="112.64" y="271.36" width="128" height="128" rx="20.48" fill="url(#violetGrad)" filter="url(#glow)"/>
  <!-- Block 4: Rose Bottom Right -->
  <rect x="271.36" y="271.36" width="128" height="128" rx="20.48" fill="url(#roseGrad)" filter="url(#glow)"/>
  
  <!-- Inner Highlight Gloss -->
  <circle cx="153.6" cy="143.36" r="15.36" fill="#FFFFFF" fill-opacity="0.6"/>
  <circle cx="312.32" cy="143.36" r="15.36" fill="#FFFFFF" fill-opacity="0.6"/>
  <circle cx="153.6" cy="302.08" r="15.36" fill="#FFFFFF" fill-opacity="0.6"/>
  <circle cx="312.32" cy="302.08" r="15.36" fill="#FFFFFF" fill-opacity="0.6"/>

  <!-- Logo Typography -->
  <text x="256" y="460.8" font-family="'Poppins', 'Segoe UI', sans-serif" font-weight="800" font-size="56.32px" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">BLOCKZU</text>
</svg>